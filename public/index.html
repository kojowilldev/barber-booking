<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mr. Brown's Barbershop — Book a Cut</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14110D;
    --surface: #221C15;
    --gold: #C9A24B;
    --gold-dim: #8A7238;
    --cream: #EFE7D8;
    --cream-dim: #B8AF9C;
    --error: #E0685A;
    --success: #7FAE6B;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--cream);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 48px 20px;
  }

  main {
    width: 100%;
    max-width: 420px;
  }

  header {
    text-align: center;
    margin-bottom: 36px;
  }

  h1 {
    font-family: 'Playfair Display', serif;
    font-size: 1.9rem;
    font-weight: 700;
    margin: 0 0 10px;
    letter-spacing: 0.01em;
  }

  .rule {
    width: 56px;
    height: 2px;
    background: var(--gold);
    margin: 0 auto;
  }

  .tagline {
    color: var(--cream-dim);
    font-size: 0.9rem;
    margin-top: 12px;
  }

  .card {
    background: var(--surface);
    border: 1px solid #3A331F;
    padding: 28px 24px;
  }

  label {
    display: block;
    font-size: 0.8rem;
    color: var(--cream-dim);
    margin-top: 20px;
    margin-bottom: 6px;
  }

  label:first-of-type { margin-top: 0; }

  input[type="date"], input[type="text"] {
    width: 100%;
    padding: 10px 12px;
    background: #1A1610;
    border: 1px solid #3A331F;
    color: var(--cream);
    font-family: inherit;
    font-size: 0.95rem;
  }

  input:focus {
    outline: none;
    border-color: var(--gold);
  }

  .slots {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 6px;
  }

  .slot-btn {
    padding: 8px 14px;
    border: 1px solid var(--gold-dim);
    background: transparent;
    color: var(--cream);
    font-family: inherit;
    font-size: 0.85rem;
    cursor: pointer;
  }

  .slot-btn:hover { border-color: var(--gold); }

  .slot-btn.selected {
    background: var(--gold);
    color: #14110D;
    border-color: var(--gold);
    font-weight: 600;
  }

  .slots-empty {
    color: var(--cream-dim);
    font-size: 0.9rem;
  }

  button.submit {
    width: 100%;
    margin-top: 26px;
    padding: 13px;
    background: var(--gold);
    color: #14110D;
    border: none;
    font-family: inherit;
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
  }

  button.submit:hover { background: #d8b566; }

  #message {
    margin-top: 16px;
    font-size: 0.9rem;
    text-align: center;
  }

  #message.error { color: var(--error); }
  #message.success { color: var(--success); }
</style>
</head>
<body>

<main>
  <header>
    <h1>Mr. Brown's Barbershop</h1>
    <div class="rule"></div>
    <p class="tagline">Book your cut in under a minute.</p>
  </header>

  <div class="card">
    <label for="date">Pick a date</label>
    <input type="date" id="date" />

    <div class="slots" id="slots"></div>

    <label for="name">Your name</label>
    <input type="text" id="name" placeholder="e.g. Kwame Mensah" />

    <label for="phone">Your phone number</label>
    <input type="text" id="phone" placeholder="e.g. 0244000111" />

    <button class="submit" id="submitBtn">Book Appointment</button>

    <div id="message"></div>
  </div>
</main>

<script>
  const dateInput = document.getElementById("date");
  const slotsDiv = document.getElementById("slots");
  const submitBtn = document.getElementById("submitBtn");
  const messageDiv = document.getElementById("message");

  let selectedSlot = null;

  dateInput.addEventListener("change", async () => {
    selectedSlot = null;
    slotsDiv.innerHTML = "";
    messageDiv.textContent = "";
    messageDiv.className = "";

    const date = dateInput.value;
    const res = await fetch(`/available-slots?date=${date}`);
    const data = await res.json();

    if (!data.slots || data.slots.length === 0) {
      slotsDiv.innerHTML = '<span class="slots-empty">No slots available that day.</span>';
      return;
    }

    data.slots.forEach((isoTime) => {
      const btn = document.createElement("button");
      btn.className = "slot-btn";
      btn.type = "button";
      const time = new Date(isoTime);
      btn.textContent = time.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });

      btn.addEventListener("click", () => {
        selectedSlot = isoTime;
        document.querySelectorAll(".slot-btn").forEach((b) => b.classList.remove("selected"));
        btn.classList.add("selected");
      });

      slotsDiv.appendChild(btn);
    });
  });

  submitBtn.addEventListener("click", async () => {
    messageDiv.textContent = "";
    messageDiv.className = "";

    const name = document.getElementById("name").value.trim();
    const phone = document.getElementById("phone").value.trim();

    if (!selectedSlot) {
      messageDiv.textContent = "Pick a time slot first.";
      messageDiv.className = "error";
      return;
    }
    if (!name || !phone) {
      messageDiv.textContent = "Enter your name and phone number.";
      messageDiv.className = "error";
      return;
    }

    const res = await fetch("/appointments", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        serviceId: "dfdfe4b6-bbfa-4c74-baba-df2468dbaf60",
        clientName: name,
        clientPhone: phone,
        startAt: selectedSlot,
      }),
    });

    const data = await res.json();

    if (res.ok) {
      messageDiv.textContent = `Booked. See you ${new Date(data.startAt).toLocaleString([], { weekday: "short", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" })}.`;
      messageDiv.className = "success";
    } else {
      messageDiv.textContent = data.error || "Something went wrong.";
      messageDiv.className = "error";
    }
  });
</script>

</body>
</html>
