<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mr. Brown's Barbershop — Bookings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14110D;
    --surface: #221C15;
    --gold: #C9A24B;
    --gold-dim: #8A7238;
    --cream: #EFE7D8;
    --cream-dim: #B8AF9C;
    --danger: #B5453D;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--cream);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    padding: 48px 20px;
  }

  main {
    max-width: 640px;
    margin: 0 auto;
  }

  header {
    text-align: center;
    margin-bottom: 32px;
  }

  h1 {
    font-family: 'Playfair Display', serif;
    font-size: 1.7rem;
    font-weight: 700;
    margin: 0 0 10px;
  }

  .rule {
    width: 56px;
    height: 2px;
    background: var(--gold);
    margin: 0 auto;
  }

  .appt {
    background: var(--surface);
    border: 1px solid #3A331F;
    border-left: 3px solid var(--gold);
    padding: 16px 18px;
    margin-bottom: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }

  .appt.canceled {
    border-left-color: #55503F;
    opacity: 0.55;
  }

  .appt-info { line-height: 1.5; font-size: 0.92rem; }
  .appt-info strong { color: var(--gold); font-weight: 600; }
  .appt-status {
    font-size: 0.78rem;
    color: var(--cream-dim);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .cancel-btn {
    padding: 7px 14px;
    background: transparent;
    border: 1px solid var(--danger);
    color: var(--danger);
    font-family: inherit;
    font-size: 0.82rem;
    cursor: pointer;
    white-space: nowrap;
  }

  .cancel-btn:hover { background: var(--danger); color: var(--cream); }
  .cancel-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  #empty {
    color: var(--cream-dim);
    text-align: center;
    padding: 20px 0;
  }
</style>
</head>
<body>

<main>
  <header>
    <h1>Today's Bookings</h1>
    <div class="rule"></div>
  </header>

  <div id="list"></div>
  <p id="empty" style="display:none;">No appointments yet.</p>
</main>

<script>
  const listDiv = document.getElementById("list");
  const emptyMsg = document.getElementById("empty");

  async function loadAppointments() {
    const res = await fetch("/appointments");
    const appointments = await res.json();

    if (appointments.length === 0) {
      listDiv.innerHTML = "";
      emptyMsg.style.display = "block";
      return;
    }
    emptyMsg.style.display = "none";

    listDiv.innerHTML = "";
    appointments.forEach((appt) => {
      const div = document.createElement("div");
      div.className = "appt" + (appt.status === "CANCELED" ? " canceled" : "");

      const time = new Date(appt.startAt).toLocaleString([], {
        weekday: "short", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit"
      });

      div.innerHTML = `
        <div class="appt-info">
          <strong>${appt.client?.name ?? "Unknown"}</strong> — ${appt.client?.phone ?? ""}<br/>
          ${appt.service?.name ?? "Service"} · ${time}<br/>
          <span class="appt-status">${appt.status}</span>
        </div>
      `;

      if (appt.status !== "CANCELED") {
        const btn = document.createElement("button");
        btn.className = "cancel-btn";
        btn.textContent = "Cancel";
        btn.addEventListener("click", async () => {
          btn.disabled = true;
          btn.textContent = "Canceling...";
          await fetch(`/appointments/${appt.id}/cancel`, { method: "PATCH" });
          loadAppointments();
        });
        div.appendChild(btn);
      }

      listDiv.appendChild(div);
    });
  }

  loadAppointments();
</script>

</body>
</html>
